name: Secrets Patterns Tests

on:
  push:
    branches: [v2-develop, main, develop]
    paths:
      - '.claude/domains/**/secrets-patterns.json'
      - '.claude/domains/**/_category.json'
      - '.claude/schemas/secrets-patterns.schema.json'
      - '.claude/schemas/lessons-learned.schema.json'
      - '.claude/state/lessons-learned.json'
      - 'scripts/validate-secrets-patterns.sh'
      - 'scripts/validate-category-weights.py'
      - 'scripts/validate-lessons-learned.py'
      - 'scripts/validate-v2-migration.py'
      - '.claude/schemas/project.schema.json'
      - '.claude/schemas/migrations.json'
      - 'tests/secrets/**'
      - 'tests/lessons/**'
      - 'tests/upgrade/**'
      - 'examples/*/.claude/state/project.json'
      - '.github/workflows/secrets-tests.yml'
  pull_request:
    branches: [v2-develop, main, develop]
    paths:
      - '.claude/domains/**/secrets-patterns.json'
      - '.claude/domains/**/_category.json'
      - '.claude/schemas/secrets-patterns.schema.json'
      - '.claude/schemas/lessons-learned.schema.json'
      - '.claude/schemas/project.schema.json'
      - '.claude/schemas/migrations.json'
      - '.claude/state/lessons-learned.json'
      - 'scripts/validate-secrets-patterns.sh'
      - 'scripts/validate-category-weights.py'
      - 'scripts/validate-lessons-learned.py'
      - 'scripts/validate-v2-migration.py'
      - 'tests/secrets/**'
      - 'tests/lessons/**'
      - 'tests/upgrade/**'
      - 'examples/*/.claude/state/project.json'
      - '.github/workflows/secrets-tests.yml'

jobs:
  validate-schema-and-regex:
    name: Validate secrets-patterns schema + regex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema==4.21.1
      - name: Validate
        run: bash scripts/validate-secrets-patterns.sh

  fixture-tests:
    name: Run secrets fixture pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest==8.0.0
      - name: Run pytest
        run: pytest tests/secrets -v

  validate-category-weights:
    name: Validate _category.json weight sums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate weight sums
        run: python3 scripts/validate-category-weights.py

  validate-lessons-learned:
    name: Validate lessons-learned schema + cross-ref + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema==4.21.1
      - name: Validate real lessons-learned (meta-repo graceful skip)
        run: python3 scripts/validate-lessons-learned.py
      - name: Positive fixture must pass
        run: python3 scripts/validate-lessons-learned.py --fixture tests/lessons/fixtures/sample-valid.json
      - name: Negative fixture (bad id) must fail
        run: |
          if python3 scripts/validate-lessons-learned.py --fixture tests/lessons/fixtures/sample-invalid-id.json; then
            echo "✗ Expected schema failure but validator exited 0"
            exit 1
          else
            echo "✓ Correctly detected schema violation"
          fi
      - name: Negative fixture (extra property) must fail
        run: |
          if python3 scripts/validate-lessons-learned.py --fixture tests/lessons/fixtures/sample-extra-property.json; then
            echo "✗ Expected additionalProperties failure but validator exited 0"
            exit 1
          else
            echo "✓ Correctly detected additionalProperties violation"
          fi

  lessons-fixture-tests:
    name: Run lessons fixture pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest + jsonschema
        run: pip install pytest==8.0.0 jsonschema==4.21.1
      - name: Run lessons pytest
        run: pytest tests/lessons -v

  validate-v2-migration:
    name: Validate v1→v2 migration fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema==4.21.1
      - name: Validate 4 v1 fixtures pass v2 schema after migrations.json apply
        run: python3 scripts/validate-v2-migration.py --diagnostic
      - name: Validate examples/* are already v2 compliant
        run: |
          for f in examples/*/.claude/state/project.json; do
            echo "→ $f"
            python3 scripts/validate-v2-migration.py --fixture "$f"
          done

  upgrade-fixture-tests:
    name: Run upgrade rollback simulation pytest (R6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest + jsonschema
        run: pip install pytest==8.0.0 jsonschema==4.21.1
      - name: Run upgrade pytest (R6 rollback round-trip)
        run: pytest tests/upgrade -v
