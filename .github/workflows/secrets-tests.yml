name: Secrets Patterns Tests

on:
  push:
    branches: [v2-develop, main, develop]
    paths:
      - '.claude/domains/**/secrets-patterns.json'
      - '.claude/domains/**/_category.json'
      - '.claude/schemas/secrets-patterns.schema.json'
      - 'scripts/validate-secrets-patterns.sh'
      - 'scripts/validate-domain-crossref.py'
      - 'scripts/validate-category-weights.py'
      - 'tests/secrets/**'
      - '.github/workflows/secrets-tests.yml'
  pull_request:
    branches: [v2-develop, main, develop]
    paths:
      - '.claude/domains/**/secrets-patterns.json'
      - '.claude/domains/**/_category.json'
      - '.claude/schemas/secrets-patterns.schema.json'
      - 'scripts/validate-secrets-patterns.sh'
      - 'scripts/validate-domain-crossref.py'
      - 'scripts/validate-category-weights.py'
      - 'tests/secrets/**'
      - '.github/workflows/secrets-tests.yml'

jobs:
  validate-schema-and-regex:
    name: Validate secrets-patterns schema + regex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema==4.21.1
      - name: Validate
        run: bash scripts/validate-secrets-patterns.sh

  fixture-tests:
    name: Run secrets fixture pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest==8.0.0
      - name: Run pytest
        run: pytest tests/secrets -v

  validate-domain-crossref:
    name: Validate domain docs cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate cross-refs
        run: python3 scripts/validate-domain-crossref.py

  validate-category-weights:
    name: Validate _category.json weight sums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate weight sums
        run: python3 scripts/validate-category-weights.py
